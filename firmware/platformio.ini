; Local compile check for the Wokwi hub: pio run -d firmware
; The same sources run in the Wokwi web editor (see README.md).

[platformio]
src_dir = PresenceSense

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
